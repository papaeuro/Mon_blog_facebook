<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralNet - Partage & Revenus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .post-card { background: white; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 h-14 flex items-center px-4 justify-between border-b">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-1.5 rounded-lg text-white">
                <i data-lucide="trending-up" class="w-6 h-6"></i>
            </div>
            <h1 class="font-bold text-xl text-blue-600">ViralNet</h1>
        </div>
        <div id="user-avatar">
            <div class="w-9 h-9 rounded-full bg-gray-200 animate-pulse"></div>
        </div>
    </nav>

    <div class="max-w-[580px] mx-auto mt-6 px-4">
        <!-- Zone Création -->
        <div class="post-card p-4 mb-5">
            <div class="flex gap-3 mb-2">
                <div id="user-avatar-small" class="w-10 h-10 rounded-full bg-gray-200"></div>
                <button onclick="toggleModal(true)" class="bg-[#F0F2F5] hover:bg-[#E4E6E9] transition-colors flex-1 rounded-full px-4 py-2 text-left text-gray-500">
                    Partager un fichier ou un lien...
                </button>
            </div>
        </div>

        <!-- Liste des Posts -->
        <div id="posts-container" class="space-y-4 pb-20">
            <!-- Les posts s'afficheront ici -->
            <div class="post-card p-8 text-center text-gray-400 italic">Chargement du fil d'actualité...</div>
        </div>
    </div>

    <!-- Modal de Publication -->
    <div id="post-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-[500px] rounded-t-2xl sm:rounded-xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg">Publier un contenu viral</h3>
                <button onclick="toggleModal(false)" class="bg-gray-100 p-2 rounded-full hover:bg-gray-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-4">
                <textarea id="post-text" class="w-full text-lg outline-none min-h-[120px] resize-none" placeholder="Décrivez votre contenu..."></textarea>
                <div class="flex items-center gap-2 bg-gray-50 p-3 rounded-lg border mb-4">
                    <i data-lucide="link" class="text-blue-500 w-5 h-5"></i>
                    <input id="post-link" type="url" placeholder="Lien (Drive, Mega, etc.)" class="flex-1 bg-transparent outline-none text-sm">
                </div>
                <button onclick="submitPost()" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
                    Publier sur le réseau
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCNqWGbj3Tac8OU7qXHTy8E0eE0xTg2tkQ",
            authDomain: "mon-blog-5b2c2.firebaseapp.com",
            projectId: "mon-blog-5b2c2",
            storageBucket: "mon-blog-5b2c2.firebasestorage.app",
            messagingSenderId: "420647912582",
            appId: "1:420647912582:web:a012b3e6f9c3588ade7d07"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mon-blog-5b2c2";
        let currentUser = null;

        // Initialisation
        auth.signInAnonymously().catch(console.error);
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`;
                document.getElementById('user-avatar').innerHTML = `<img src="${avatarUrl}" class="w-9 h-9 rounded-full border">`;
                document.getElementById('user-avatar-small').innerHTML = `<img src="${avatarUrl}" class="w-10 h-10 rounded-full border">`;
                loadPosts();
            }
        });

        function toggleModal(show) {
            document.getElementById('post-modal').classList.toggle('hidden', !show);
        }

        async function submitPost() {
            const content = document.getElementById('post-text').value;
            const link = document.getElementById('post-link').value;
            if (!content) return;

            document.getElementById('submit-btn').innerText = "Envoi...";
            document.getElementById('submit-btn').disabled = true;

            try {
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('posts').add({
                    content: content,
                    mediaUrl: link,
                    authorName: "Membre Pro",
                    authorPhoto: `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentUser.uid}`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    likes: 0
                });
                document.getElementById('post-text').value = "";
                document.getElementById('post-link').value = "";
                toggleModal(false);
            } catch (e) { console.error(e); }
            
            document.getElementById('submit-btn').innerText = "Publier sur le réseau";
            document.getElementById('submit-btn').disabled = false;
        }

        function loadPosts() {
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('posts')
                .onSnapshot(snapshot => {
                    const container = document.getElementById('posts-container');
                    container.innerHTML = "";
                    const posts = [];
                    snapshot.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
                    
                    posts.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

                    posts.forEach((post, index) => {
                        const html = `
                            <div class="post-card overflow-hidden">
                                <div class="p-4 flex gap-3">
                                    <img src="${post.authorPhoto}" class="w-10 h-10 rounded-full border">
                                    <div>
                                        <h4 class="font-bold text-sm">${post.authorName}</h4>
                                        <p class="text-[10px] text-gray-400">Publié récemment</p>
                                    </div>
                                </div>
                                <div class="px-4 pb-3 text-[15px]">${post.content}</div>
                                ${post.mediaUrl ? `
                                    <div class="bg-blue-50 p-6 border-y text-center flex flex-col items-center gap-2">
                                        <i data-lucide="download" class="text-blue-600 w-8 h-8"></i>
                                        <a href="${post.mediaUrl}" target="_blank" class="text-blue-600 font-bold underline text-sm break-all">Accéder au contenu viral</a>
                                    </div>
                                ` : ''}
                                <div class="px-4 py-2 border-t flex justify-around text-gray-500 font-bold text-xs">
                                    <button class="flex items-center gap-1"><i data-lucide="thumbs-up" class="w-4 h-4"></i> J'aime</button>
                                    <button class="flex items-center gap-1"><i data-lucide="message-square" class="w-4 h-4"></i> Avis</button>
                                </div>
                            </div>
                            ${(index === 0 || (index + 1) % 3 === 0) ? `
                                <div class="bg-gray-100 rounded-xl p-4 text-center border-2 border-dashed border-gray-300">
                                    <p class="text-[10px] text-gray-400 font-bold uppercase">Sponsorisé</p>
                                    <p class="text-xs text-gray-400 italic py-2">Espace Publicitaire (Tes revenus s'afficheront ici)</p>
                                </div>
                            ` : ''}
                        `;
                        container.innerHTML += html;
                    });
                    lucide.createIcons();
                });
        }
        lucide.createIcons();
    </script>
</body>
                  </html>
